[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "narria"
version = "2.0.0"
description = "NARR'IA — Narratologie computationnelle du plagiat d'intrigue"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Adéchinan David Adékambi"}
]
keywords = ["narratology", "plagiarism-detection", "nlp", "computational-humanities", "african-literature"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: French",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "Flask>=3.0.0",
]

[project.scripts]
narria-app = "narria.app:main"

[tool.setuptools.packages.find]
include = ["narria*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
narria = ["templates/*.html", "static/css/*.css", "static/js/*.js", "samples/*.json"]
