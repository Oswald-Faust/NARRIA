<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Réinitialisation du mot de passe — NARR'IA</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --narria-bleu: #1F4E79;
      --narria-bleu-clair: #2E5F8E;
      --narria-gold: #C55A11;
      --narria-creme: #EAE0C5;
      --narria-ivoire: #EFE7CE;
      --narria-papier: #F2EBD5;
      --narria-tranche-clair: #C9B98A;
      --narria-encre: #1A1A1A;
      --narria-texte: #4A4438;
      --narria-discret: #6B6354;
      --narria-tres-discret: #8C8473;
      --narria-filet: #C9BEA0;
      --narria-erreur-fond: #FCE4D6;
      --narria-erreur-texte: #8B2400;
      --narria-succes-fond: #E8F2E4;
      --narria-succes-texte: #2D5016;
      --police-erudite: 'EB Garamond', 'Garamond', Georgia, serif;
      --police-fonctionnelle: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100vh; }
    body {
      font-family: var(--police-fonctionnelle);
      background: var(--narria-ivoire);
      color: var(--narria-encre);
      font-size: 15px;
      line-height: 1.55;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .narria-header {
      background: var(--narria-papier);
      border-bottom: 0.5px solid var(--narria-filet);
      padding: 1.2rem 2rem;
      display: flex;
      align-items: center;
      gap: 0.9rem;
    }
    .brand-logo { width: 44px; height: 44px; flex-shrink: 0; }
    .brand-text h1 {
      font-family: var(--police-erudite);
      font-size: 24px;
      color: var(--narria-bleu);
      font-weight: 400;
      margin: 0;
      line-height: 1;
    }
    .brand-text h1 .accent { color: var(--narria-gold); }
    .brand-text .subtitle {
      font-family: var(--police-erudite);
      font-size: 12px;
      color: var(--narria-texte);
      font-style: italic;
      font-weight: 600;
      margin: 0.15rem 0 0;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .auth-card {
      background: var(--narria-papier);
      border: 0.5px solid var(--narria-filet);
      max-width: 440px;
      width: 100%;
      padding: 2.5rem 2.2rem;
    }
    .auth-card-header {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 0.5rem;
    }
    .auth-icone {
      width: 22px; height: 22px;
      stroke: var(--narria-gold);
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .auth-marqueur {
      font-family: var(--police-fonctionnelle);
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--narria-gold);
      text-transform: uppercase;
      font-weight: 600;
    }
    .auth-card h2 {
      font-family: var(--police-erudite);
      font-size: 28px;
      color: var(--narria-bleu);
      font-weight: 400;
      margin: 0 0 0.5rem;
      line-height: 1.15;
    }
    .auth-card .lead {
      font-family: var(--police-fonctionnelle);
      font-size: 14px;
      color: var(--narria-texte);
      line-height: 1.6;
      margin: 0 0 2rem;
    }

    .form-field { margin-bottom: 1.3rem; }
    label {
      font-family: var(--police-fonctionnelle);
      display: block;
      font-size: 11px;
      color: var(--narria-discret);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 0.4rem;
      font-weight: 500;
    }
    input[type="password"] {
      width: 100%;
      padding: 0.6rem 0;
      border: none;
      border-bottom: 1px solid var(--narria-bleu);
      background: transparent;
      font-family: var(--police-fonctionnelle);
      font-size: 14.5px;
      color: var(--narria-encre);
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-bottom-color: var(--narria-gold); }
    .password-wrapper { position: relative; }
    .password-wrapper input { padding-right: 2rem; }
    .toggle-password {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0.3rem;
      color: var(--narria-discret);
    }
    .toggle-password svg {
      width: 18px; height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .toggle-password:hover { color: var(--narria-bleu); }
    .field-hint {
      font-family: var(--police-fonctionnelle);
      font-size: 11.5px;
      color: var(--narria-discret);
      margin-top: 0.3rem;
      font-style: italic;
    }

    .btn {
      background: var(--narria-bleu);
      color: var(--narria-papier);
      border: 0.5px solid var(--narria-bleu);
      padding: 0.7rem 1.5rem;
      font-family: var(--police-fonctionnelle);
      font-size: 13.5px;
      letter-spacing: 0.04em;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
      transition: background 0.15s;
    }
    .btn:hover { background: var(--narria-bleu-clair); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .auth-footer {
      margin-top: 1.5rem;
      padding-top: 1.2rem;
      border-top: 0.5px solid var(--narria-filet);
      text-align: center;
      font-family: var(--police-fonctionnelle);
      font-size: 13px;
      color: var(--narria-texte);
    }
    .auth-footer a {
      color: var(--narria-gold);
      text-decoration: none;
      border-bottom: 0.5px solid var(--narria-gold);
      font-weight: 500;
    }
    .auth-footer a:hover { color: var(--narria-bleu); border-bottom-color: var(--narria-bleu); }

    .alert-error, .alert-success {
      padding: 0.8rem 1rem;
      font-family: var(--police-fonctionnelle);
      font-size: 13.5px;
      margin-bottom: 1.5rem;
      border-left: 3px solid;
    }
    .alert-error {
      background: var(--narria-erreur-fond);
      color: var(--narria-erreur-texte);
      border-left-color: var(--narria-erreur-texte);
    }
    .alert-success {
      background: var(--narria-succes-fond);
      color: var(--narria-succes-texte);
      border-left-color: var(--narria-succes-texte);
    }

    .narria-pied {
      padding: 1.4rem 2rem;
      border-top: 0.5px solid var(--narria-filet);
      background: var(--narria-papier);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
    }
    .narria-pied img { width: 28px; height: 28px; flex-shrink: 0; }
    .narria-pied .pied-text {
      font-family: var(--police-fonctionnelle);
      font-size: 12px;
      color: var(--narria-tres-discret);
      letter-spacing: 0.12em;
      font-weight: 700;
    }

    @media (max-width: 600px) {
      .narria-header { padding: 0.9rem 1rem; }
      .brand-logo { width: 36px; height: 36px; }
      .brand-text h1 { font-size: 21px; }
      .brand-text .subtitle { font-size: 11px; }
      main { padding: 1.2rem 0.8rem; }
      .auth-card { padding: 1.8rem 1.4rem; }
      .auth-card h2 { font-size: 24px; }
    }
  </style>
</head>
<body>

  <header class="narria-header">
    <img class="brand-logo" src="{{ url_for('static', filename='img/logo.png') }}" alt="">
    <div class="brand-text">
      <h1>Narr<span class="accent">'</span>ia</h1>
      <p class="subtitle">Narratologie computationnelle du plagiat d'intrigue</p>
    </div>
  </header>

  <main>
    <div class="auth-card">
      <div class="auth-card-header">
        <svg class="auth-icone" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="1"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/><circle cx="12" cy="16" r="1"/></svg>
        <span class="auth-marqueur">Réinitialisation</span>
      </div>
      <h2>Nouveau mot de passe</h2>
      <p class="lead">Saisissez et confirmez votre nouveau mot de passe pour finaliser la réinitialisation.</p>

      <div id="errorBox" class="alert-error" style="display:none"></div>
      <div id="successBox" class="alert-success" style="display:none"></div>

      <div class="form-field">
        <label for="password">Nouveau mot de passe</label>
        <div class="password-wrapper">
          <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8">
          <button type="button" class="toggle-password" id="togglePassword" aria-label="Afficher le mot de passe">
            <svg id="eyeIcon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <p class="field-hint">Au moins huit caractères.</p>
      </div>

      <div class="form-field">
        <label for="password2">Confirmer le mot de passe</label>
        <div class="password-wrapper">
          <input type="password" id="password2" name="password2" autocomplete="new-password" required minlength="8">
          <button type="button" class="toggle-password" id="togglePassword2" aria-label="Afficher le mot de passe">
            <svg id="eyeIcon2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <button type="button" class="btn" id="submitBtn">Réinitialiser le mot de passe</button>

      <div class="auth-footer">
        <a href="/login">Retour à la connexion</a>
      </div>
    </div>
  </main>

  <footer class="narria-pied">
    <img src="{{ url_for('static', filename='img/logo.png') }}" alt="">
    <span class="pied-text">NARR'IA · 2026</span>
  </footer>

  <script>
    // Œil sur les deux champs de mot de passe
    function setupTogglePassword(toggleId, inputId, iconId) {
      const toggle = document.getElementById(toggleId);
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      toggle.addEventListener('click', () => {
        const isPwd = input.type === 'password';
        input.type = isPwd ? 'text' : 'password';
        icon.innerHTML = isPwd
          ? '<path d="M17.94 17.94A10.06 10.06 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
          : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
      });
    }
    setupTogglePassword('togglePassword', 'password', 'eyeIcon');
    setupTogglePassword('togglePassword2', 'password2', 'eyeIcon2');

    // Récupération du token depuis l'URL
    const token = new URLSearchParams(window.location.search).get('token');

    // Soumission du formulaire
    const submitBtn = document.getElementById('submitBtn');
    const passwordInput = document.getElementById('password');
    const password2Input = document.getElementById('password2');
    const errorBox = document.getElementById('errorBox');
    const successBox = document.getElementById('successBox');

    // Vérification immédiate du token au chargement
    if (!token) {
      errorBox.textContent = 'Lien de réinitialisation invalide. Veuillez recommencer la procédure depuis la page « Mot de passe oublié ».';
      errorBox.style.display = 'block';
      submitBtn.disabled = true;
    }

    async function submitReset() {
      errorBox.style.display = 'none';
      successBox.style.display = 'none';
      const password = passwordInput.value;
      const password2 = password2Input.value;

      if (!password || !password2) {
        errorBox.textContent = 'Veuillez renseigner les deux champs.';
        errorBox.style.display = 'block';
        return;
      }
      if (password.length < 8) {
        errorBox.textContent = 'Le mot de passe doit comporter au moins huit caractères.';
        errorBox.style.display = 'block';
        return;
      }
      if (password !== password2) {
        errorBox.textContent = 'Les deux mots de passe ne correspondent pas.';
        errorBox.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Réinitialisation en cours…';
      try {
        const response = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({token: token, password: password})
        });
        const data = await response.json();
        if (response.ok) {
          successBox.textContent = 'Mot de passe modifié. Redirection vers la connexion…';
          successBox.style.display = 'block';
          submitBtn.textContent = 'Mot de passe modifié';
          setTimeout(() => { window.location.href = '/login'; }, 2000);
        } else {
          errorBox.textContent = data.error || 'Erreur lors de la réinitialisation.';
          errorBox.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Réinitialiser le mot de passe';
        }
      } catch (err) {
        errorBox.textContent = 'Erreur de réseau. Réessayez.';
        errorBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Réinitialiser le mot de passe';
      }
    }

    submitBtn.addEventListener('click', submitReset);
    [passwordInput, password2Input].forEach(input => {
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); submitReset(); }
      });
    });
  </script>
</body>
</html>
