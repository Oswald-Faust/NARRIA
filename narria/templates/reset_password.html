<main>
  <div class="auth-card">
    <div class="auth-header">
      <h1>Nouveau mot de passe</h1>
      <p>Entrez votre nouveau mot de passe.</p>
    </div>

    <div id="errorBox" class="alert-error" style="display:none"></div>
    <div id="successBox" class="alert-success" style="display:none"></div>

    <div class="form-field">
      <label for="password">Nouveau mot de passe</label>
      <input type="password" id="password" required>
    </div>

    <div class="form-field">
      <label for="password2">Confirmer le mot de passe</label>
      <input type="password" id="password2" required>
    </div>

    <button type="button" class="btn" id="submitBtn">Réinitialiser</button>

    <div class="auth-footer">
      <a href="/login">Retour à la connexion</a>
    </div>
  </div>

  <script>
    const token = new URLSearchParams(window.location.search).get('token');
    document.getElementById('submitBtn').addEventListener('click', async function() {
      const password = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;
      const errorBox = document.getElementById('errorBox');
      const successBox = document.getElementById('successBox');
      errorBox.style.display = 'none';
      successBox.style.display = 'none';
      if (!password || password !== password2) {
        errorBox.textContent = 'Les mots de passe ne correspondent pas.';
        errorBox.style.display = 'block';
        return;
      }
      const response = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({token: token, password: password})
      });
      const data = await response.json();
      if (response.ok) {
        successBox.textContent = 'Mot de passe modifié ! Redirection...';
        successBox.style.display = 'block';
        setTimeout(() => window.location.href = '/login', 2000);
      } else {
        errorBox.textContent = data.error;
        errorBox.style.display = 'block';
      }
    });
  </script>
</main>
