<main>
  <div class="auth-card">
    <div class="auth-header">
      <h1>Mot de passe oublié</h1>
      <p>Entrez votre adresse email pour recevoir un lien de réinitialisation.</p>
    </div>

    <div id="errorBox" class="alert-error" style="display:none"></div>
    <div id="successBox" class="alert-success" style="display:none"></div>

    <div class="form-field">
      <label for="email">Adresse courriel</label>
      <input type="email" id="email" name="email" required>
    </div>

    <button type="button" class="btn" id="submitBtn">Envoyer le lien</button>

    <div class="auth-footer">
      <a href="/login">Retour à la connexion</a>
    </div>
  </div>
  <script>
document.getElementById('submitBtn').addEventListener('click', async function() {
    const email = document.getElementById('email').value.trim();
    const errorBox = document.getElementById('errorBox');
    const successBox = document.getElementById('successBox');
    
    errorBox.style.display = 'none';
    successBox.style.display = 'none';

    if (!email) {
        errorBox.textContent = 'Veuillez entrer votre adresse email.';
        errorBox.style.display = 'block';
        return;
    }

    const response = await fetch('/api/auth/forgot-password', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({email: email})
    });

    const data = await response.json();

    if (response.ok) {
        successBox.textContent = data.message;
        successBox.style.display = 'block';
    } else {
        errorBox.textContent = data.error;
        errorBox.style.display = 'block';
    }
});
</script>
</main>
