<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connexion — NARR'IA</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #1F4E79 0%, #2E5F8E 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 1rem;
        }
        .auth-card {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
        }
        .logo-row {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .logo-row img {
            width: 72px;
            height: 72px;
        }
        h1 {
            text-align: center;
            color: #1F4E79;
            margin: 0 0 0.5rem 0;
            font-size: 1.6rem;
        }
        .subtitle {
            text-align: center;
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        label {
            display: block;
            color: #333;
            font-size: 0.9rem;
            margin-bottom: 0.4rem;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 0.7rem 1rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #1F4E79;
            box-shadow: 0 0 0 3px rgba(31,78,121,0.1);
        }
        button {
            width: 100%;
            background: #1F4E79;
            color: white;
            border: none;
            padding: 0.85rem;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 0.5rem;
        }
        button:hover { background: #2E5F8E; }
        button:disabled { background: #999; cursor: not-allowed; }
        .alt-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #666;
        }
        .alt-link a {
            color: #C55A11;
            font-weight: 500;
            text-decoration: none;
        }
        .alt-link a:hover { text-decoration: underline; }
        .error-msg {
            background: #FCE4D6;
            color: #8B2400;
            padding: 0.75rem 1rem;
            border-radius: 6px;
            border-left: 4px solid #C55A11;
            margin-bottom: 1.2rem;
            font-size: 0.9rem;
            display: none;
        }
        .error-msg.show { display: block; }
        footer {
            text-align: center;
            color: rgba(255,255,255,0.7);
            font-size: 0.85rem;
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>
    <div>
        <div class="auth-card">
            <div class="logo-row">
                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="NARR'IA">
            </div>
            <h1>NARR'IA</h1>
            <div class="subtitle">Narratologie computationnelle du plagiat d'intrigue</div>

            <div id="error" class="error-msg"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Adresse e-mail</label>
                    <input type="email" id="email" name="email" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit" id="submitBtn">Se connecter</button>
            </form>

            <div class="alt-link">
                Pas encore de compte ? <a href="{{ url_for('register_page') }}">Créer un compte</a>
            </div>
        </div>
        <footer>
            © 2026 Adéchinan David Adékambi · Université de Kindia
        </footer>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const errorBox = document.getElementById('error');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.classList.remove('show');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Connexion...';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value,
                    })
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    // Récupère le paramètre next= de l'URL si présent
                    const params = new URLSearchParams(window.location.search);
                    window.location.href = params.get('next') || '/';
                } else {
                    errorBox.textContent = data.error || 'Erreur de connexion';
                    errorBox.classList.add('show');
                }
            } catch (err) {
                errorBox.textContent = 'Erreur réseau : ' + err.message;
                errorBox.classList.add('show');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Se connecter';
            }
        });
    </script>
</body>
</html>
