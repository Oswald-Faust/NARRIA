<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connexion — NARR'IA</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --narria-bleu: #1F4E79;
            --narria-gold: #C55A11;
            --narria-ivoire: #FBFAF6;
            --narria-papier: #FFFFFF;
            --narria-tranche-clair: #C9B98A;
            --narria-encre: #1A1A1A;
            --narria-texte: #4A4438;
            --narria-discret: #6B6354;
            --narria-tres-discret: #8C8473;
            --narria-filet: #E8E4D8;
            --narria-erreur-fond: #FCE4D6;
            --narria-erreur-texte: #8B2400;
            --police-erudite: 'EB Garamond', 'Garamond', Georgia, serif;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            font-family: var(--police-erudite);
            background: var(--narria-ivoire);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: var(--narria-encre);
        }
        .auth-shell {
            width: 100%;
            max-width: 520px;
            background: var(--narria-papier);
            display: grid;
            grid-template-columns: 84px 1fr;
            box-shadow: 0 1px 0 var(--narria-filet);
            border: 0.5px solid var(--narria-filet);
        }

        /* Tranche bleue, à gauche, comme la tranche d'un livre */
        .auth-tranche {
            background: var(--narria-bleu);
            padding: 2.5rem 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 560px;
        }
        .tranche-haut, .tranche-bas {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            font-family: var(--police-erudite);
            font-size: 11px;
            letter-spacing: 0.32em;
            color: var(--narria-tranche-clair);
            text-transform: uppercase;
        }
        .tranche-bas { font-size: 10px; letter-spacing: 0.28em; }
        .tranche-marque {
            font-family: var(--police-erudite);
            font-size: 48px;
            color: var(--narria-papier);
            font-weight: 400;
            line-height: 1;
        }

        /* Corps de la page : zone de connexion */
        .auth-corps {
            padding: 2.6rem 2.5rem 2rem;
        }
        .paragraph-numero {
            font-family: var(--police-erudite);
            font-size: 11px;
            letter-spacing: 0.25em;
            color: var(--narria-gold);
            text-transform: uppercase;
            margin-bottom: 0.4rem;
        }
        h1 {
            font-family: var(--police-erudite);
            font-size: 32px;
            color: var(--narria-bleu);
            font-weight: 400;
            margin: 0 0 0.3rem 0;
            line-height: 1.05;
        }
        .sous-titre {
            font-size: 13px;
            color: var(--narria-texte);
            font-style: italic;
            line-height: 1.5;
            margin-bottom: 2rem;
        }

        /* Formulaire */
        .champ {
            margin-bottom: 1.4rem;
        }
        .champ-mdp { margin-bottom: 0.5rem; }
        label {
            display: block;
            font-size: 11px;
            color: var(--narria-discret);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-bottom: 0.4rem;
        }
        input[type="email"], input[type="password"], input[type="text"] {
            width: 100%;
            padding: 0.65rem 0;
            border: none;
            border-bottom: 1px solid var(--narria-bleu);
            background: transparent;
            font-family: var(--police-erudite);
            font-size: 15px;
            color: var(--narria-encre);
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-bottom-color: var(--narria-gold); }

        /* Champ mot de passe avec œil */
        .mdp-wrap { position: relative; }
        .mdp-wrap input { padding-right: 2.4rem; }
        .oeil-btn {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            padding: 4px 6px;
            cursor: pointer;
            color: var(--narria-discret);
            display: flex;
            align-items: center;
        }
        .oeil-btn:hover { color: var(--narria-bleu); }
        .oeil-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.5; }

        /* Mot de passe oublié */
        .oublie-ligne {
            text-align: right;
            margin-bottom: 1.8rem;
        }
        .oublie-ligne a {
            font-family: var(--police-erudite);
            font-size: 12px;
            color: var(--narria-discret);
            text-decoration: none;
            font-style: italic;
        }
        .oublie-ligne a:hover { color: var(--narria-bleu); }

        /* Bouton principal */
        button.principal {
            width: 100%;
            padding: 0.85rem;
            background: var(--narria-bleu);
            color: var(--narria-papier);
            border: none;
            font-family: var(--police-erudite);
            font-size: 14px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }
        button.principal:hover { background: #2E5F8E; }
        button.principal:disabled { background: var(--narria-discret); cursor: not-allowed; }

        /* Bloc inscription */
        .bloc-inscription {
            margin-top: 2rem;
            padding-top: 1.4rem;
            border-top: 0.5px solid var(--narria-filet);
        }
        .bloc-inscription p {
            font-family: var(--police-erudite);
            font-size: 14px;
            color: var(--narria-texte);
            line-height: 1.6;
            margin: 0;
        }
        .bloc-inscription a {
            color: var(--narria-gold);
            text-decoration: none;
            border-bottom: 0.5px solid var(--narria-gold);
        }

        /* Signature en pied */
        .signature {
            margin-top: 2.2rem;
            padding-top: 1rem;
            border-top: 0.5px solid var(--narria-filet);
            text-align: center;
            font-family: var(--police-erudite);
            font-size: 11px;
            color: var(--narria-tres-discret);
            letter-spacing: 0.15em;
            font-style: italic;
        }

        /* Message d'erreur */
        .erreur-msg {
            background: var(--narria-erreur-fond);
            color: var(--narria-erreur-texte);
            padding: 0.75rem 1rem;
            border-left: 3px solid var(--narria-gold);
            margin-bottom: 1.3rem;
            font-size: 14px;
            font-style: italic;
            display: none;
        }
        .erreur-msg.show { display: block; }

        /* Adaptation mobile : on remet la tranche en haut */
        @media (max-width: 520px) {
            .auth-shell {
                grid-template-columns: 1fr;
            }
            .auth-tranche {
                min-height: auto;
                padding: 1.5rem 1rem;
                flex-direction: row;
                justify-content: center;
                gap: 1.5rem;
            }
            .tranche-haut, .tranche-bas {
                writing-mode: horizontal-tb;
                transform: none;
                font-size: 9px;
            }
            .tranche-marque { font-size: 32px; }
            .auth-corps { padding: 2rem 1.6rem 1.6rem; }
            h1 { font-size: 26px; }
        }
    </style>
</head>
<body>
    <div class="auth-shell">
        <aside class="auth-tranche" aria-hidden="true">
            <div class="tranche-haut">Narratologie computationnelle</div>
            <div class="tranche-marque">N</div>
            <div class="tranche-bas">narria.tech · 2026</div>
        </aside>

        <main class="auth-corps">
            <div class="paragraph-numero">§ I — Accès</div>
            <h1>Connexion</h1>
            <div class="sous-titre">à la plateforme de narratologie<br>computationnelle Narr'ia</div>

            <div id="error" class="erreur-msg" role="alert"></div>

            <form id="loginForm" novalidate>
                <div class="champ">
                    <label for="email">Courriel</label>
                    <input type="email" id="email" name="email" required autocomplete="email"
                           placeholder="prenom.nom@institution.fr">
                </div>

                <div class="champ champ-mdp">
                    <label for="password">Mot de passe</label>
                    <div class="mdp-wrap">
                        <input type="password" id="password" name="password" required autocomplete="current-password"
                               placeholder="••••••••">
                        <button type="button" id="pwdToggle" class="oeil-btn"
                                aria-label="Afficher le mot de passe">
                            <svg id="oeilOuvert" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg id="oeilFerme" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" style="display:none;" aria-hidden="true">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="oublie-ligne">
                    <a href="#" id="forgotLink">mot de passe oublié ?</a>
                </div>

                <button type="submit" id="submitBtn" class="principal">Se connecter</button>
            </form>

            <div class="bloc-inscription">
                <div class="paragraph-numero">§ II — Demander accès</div>
                <p>Pas encore inscrit&nbsp;? <a href="{{ url_for('register_page') }}">Demander un compte</a>.</p>
            </div>

            <div class="signature">Adéchinan David Adékambi</div>
        </main>
    </div>

    <script>
        // Affichage / masquage du mot de passe
        (function() {
            var btn = document.getElementById('pwdToggle');
            var inp = document.getElementById('password');
            var ouvert = document.getElementById('oeilOuvert');
            var ferme = document.getElementById('oeilFerme');
            btn.addEventListener('click', function() {
                if (inp.type === 'password') {
                    inp.type = 'text';
                    ouvert.style.display = 'none';
                    ferme.style.display = '';
                    btn.setAttribute('aria-label', 'Masquer le mot de passe');
                } else {
                    inp.type = 'password';
                    ouvert.style.display = '';
                    ferme.style.display = 'none';
                    btn.setAttribute('aria-label', 'Afficher le mot de passe');
                }
            });
        })();

        // Logique de soumission — identique au comportement précédent
        const form = document.getElementById('loginForm');
        const errorBox = document.getElementById('error');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.classList.remove('show');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Connexion…';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value,
                    })
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    const params = new URLSearchParams(window.location.search);
                    window.location.href = params.get('next') || '/';
                } else {
                    errorBox.textContent = data.error || 'Erreur de connexion';
                    errorBox.classList.add('show');
                }
            } catch (err) {
                errorBox.textContent = 'Erreur réseau : ' + err.message;
                errorBox.classList.add('show');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Se connecter';
            }
        });

        // « Mot de passe oublié » — pour le moment, message d'attente
        // (route à implémenter au chantier 2 — fonctionnalités de compte)
        document.getElementById('forgotLink').addEventListener('click', function(e) {
            e.preventDefault();
            errorBox.textContent = 'La récupération du mot de passe sera disponible prochainement. Pour le moment, contactez l\'administrateur.';
            errorBox.classList.add('show');
        });
    </script>
</body>
</html>
